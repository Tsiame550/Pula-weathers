<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><style>/* Stage adapted from user-provided Pip Weather.html */

.stage {
  --walk: 3s; --d: .7s; --cd: 90s; --amp: 8deg;
  --sky1: #6f8296; --sky2: #aebccb; --ground: #4f8a68; --path: #8c97a0; --hill: #5d7f78;
  --cloud: #8895a3; --tree: #3f7d58; --coat: #f2b705; --pants: #35384a; --pants-s: #35384a;
  --boot: #2b2d3a; --umb: #2f7fd1; --scarf: #f2e9d8; --wall: #efe3cf; --roof: #4d5f80;
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--sky1);
}
.stage svg { display: block; width: 100%; height: auto; }
.stage[data-w="hot"]   { --walk: 3.8s; --cd: 170s; --sky1: #2f98ee; --sky2: #c4e8ff; --ground: #cdb95a; --path: #ecdcae; --hill: #b8c46a; --tree: #5a9a43; --coat: #ff9a3c; --pants: #f0c7a3; --pants-s: #2f6aa6; --boot: #ffffff; }
.stage[data-w="rain"]  { --walk: 3s; --cd: 90s; }
.stage[data-w="snow"]  { --walk: 3.4s; --cd: 120s; --sky1: #b5c4d8; --sky2: #e9eff6; --ground: #f5f9fd; --path: #dce6f0; --hill: #d0dce9; --cloud: #e3e9f0; --tree: #e6eff8; --coat: #3d6fb5; --boot: #4a3a36; --roof: #5a6c8c; }
.stage[data-w="storm"] { --walk: 2.2s; --cd: 40s; --amp: 14deg; --sky1: #262c3d; --sky2: #5a6478; --ground: #3a5a52; --path: #666e7c; --hill: #3d4f58; --cloud: #454b5f; --tree: #2f5f4a; --umb: #6a4fb3; }
.stage[data-w="wind"]  { --walk: 4.2s; --cd: 14s; --amp: 32deg; --sky1: #78b3e6; --sky2: #d8edf9; --ground: #7cb35e; --path: #cfd3c8; --hill: #8fbf7a; --cloud: #ffffff; --tree: #5fae5b; --coat: #2f9e8f; --pants: #4a4f66; --pants-s: #4a4f66; }
.stage[data-w="fog"]   { --walk: 4.4s; --cd: 110s; --sky1: #aab3bd; --sky2: #dadee1; --ground: #8da194; --path: #b6bcc1; --hill: #a7b3ae; --cloud: #cfd5da; --tree: #5c7f6c; --coat: #7c6fd1; --scarf: #f6c85f; }
.sky-s1 { stop-color: var(--sky1); transition: stop-color .8s; }
.sky-s2 { stop-color: var(--sky2); transition: stop-color .8s; }

/* scene-conditional layers */
.l-sun, .l-heat, .p-rain, .p-ripple, .p-snow, .p-leaf, .p-streak, .l-fog, .l-bolt, .l-flash, .snowcap { display: none; }
[data-w="hot"] .l-sun, [data-w="hot"] .l-heat { display: inline; }
[data-w="hot"] .l-clouds { display: none; }
[data-w="rain"] .p-rain, [data-w="storm"] .p-rain, [data-w="rain"] .p-ripple, [data-w="storm"] .p-ripple { display: inline; }
[data-w="snow"] .p-snow, [data-w="snow"] .snowcap { display: inline; }
[data-w="wind"] .p-leaf, [data-w="wind"] .p-streak { display: inline; }
[data-w="fog"] .l-fog { display: inline; }
[data-w="storm"] .l-bolt, [data-w="storm"] .l-flash { display: inline; }
[data-w="fog"] .far { opacity: .45; }
.far { transition: opacity .6s; }

/* clouds */
.l-clouds .cl { fill: var(--cloud); transition: fill .8s; }
.drift { animation: drift calc(var(--cd) * var(--k)) linear infinite; animation-delay: calc(var(--cd) * var(--k) * var(--f)); }
[data-w="wind"] .drift { animation-direction: reverse; }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(1020px); } }

/* sun and heat */
.rays { animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sun-core { animation: pulse 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { to { transform: scale(1.06); } }
.heat path { animation: shimmer 2.2s linear infinite; }
.heat path:nth-child(2) { animation-duration: 3s; }
.heat path:nth-child(3) { animation-duration: 2.6s; animation-direction: reverse; }
@keyframes shimmer { from { transform: translateX(0); } to { transform: translateX(-80px); } }

/* tree sway */
.tree { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite alternate; }
[data-w="storm"] .tree { animation: sway-hard .7s ease-in-out infinite alternate; }
[data-w="wind"] .tree { animation: sway-hard 1s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1deg); } to { transform: rotate(1.2deg); } }
@keyframes sway-hard { from { transform: rotate(-3deg); } to { transform: rotate(-8deg); } }
.tree-fill { fill: var(--tree); transition: fill .8s; }

/* house */
.door { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(.18); }
.run .door { animation: dooropen .5s ease-out .1s both; }
@keyframes dooropen { from { transform: scaleX(1); } to { transform: scaleX(.18); } }

/* particles */
.p-rain line { animation: fall var(--dur) linear infinite; animation-delay: var(--dl); }
.p-rain { transform-origin: 400px 250px; }
[data-w="rain"] .p-rain { transform: rotate(6deg); }
[data-w="storm"] .p-rain { transform: rotate(15deg); }
[data-w="storm"] .p-rain line { animation-duration: calc(var(--dur) * .65); }
@keyframes fall { from { transform: translateY(-170px); } to { transform: translateY(720px); } }
.p-ripple ellipse { transform-box: fill-box; transform-origin: center; animation: ripple 1.3s ease-out infinite; animation-delay: var(--dl); }
@keyframes ripple { 0% { transform: scale(.2); opacity: .8; } 100% { transform: scale(1.7); opacity: 0; } }
.p-snow circle { animation: snow var(--dur) linear infinite; animation-delay: var(--dl); }
@keyframes snow { from { transform: translate(0, -20px); } to { transform: translate(var(--sx), 520px); } }
.p-leaf path { animation: leaf var(--dur) linear infinite; animation-delay: var(--dl); }
@keyframes leaf { from { transform: translate(880px, var(--y0)) rotate(0deg); } to { transform: translate(-60px, var(--y1)) rotate(-720deg); } }
.p-streak path { animation: streak var(--dur) linear infinite; animation-delay: var(--dl); }
@keyframes streak { from { transform: translate(900px, var(--y)); } to { transform: translate(-220px, var(--y)); } }
.fogband { animation: fogdrift var(--dur) ease-in-out infinite alternate; }
@keyframes fogdrift { from { transform: translateX(-120px); } to { transform: translateX(120px); } }
.l-flash rect { animation: flash 7s linear infinite; opacity: 0; }
.l-bolt { animation: flash 7s linear infinite; opacity: 0; }
@keyframes flash { 0%, 3% { opacity: 0; } 4% { opacity: 1; } 5.5% { opacity: .15; } 7% { opacity: .9; } 11%, 100% { opacity: 0; } }

/* ---------- Pip ---------- */
.walkx { transform: translateX(520px); }
.run .walkx { animation: walkin var(--walk) cubic-bezier(.3, .1, .6, 1) var(--d) both; }
@keyframes walkin { from { transform: translateX(140px); } to { transform: translateX(520px); } }
.run .appear { animation: appear .3s ease-out .5s both; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }
.run .bob { animation: bob calc(var(--walk) / 10) ease-in-out var(--d) 10 both; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.armL, .armR, .legL, .legR { transform-origin: 0 0; }
.run .legL { animation: stepA calc(var(--walk) / 5) ease-in-out var(--d) 5 both; }
.run .legR { animation: stepA calc(var(--walk) / 5) ease-in-out var(--d) 5 both reverse; }
.run .armL { animation: armA calc(var(--walk) / 5) ease-in-out var(--d) 5 both reverse; }
@keyframes stepA { 0% { transform: rotate(0); } 25% { transform: rotate(28deg); } 75% { transform: rotate(-28deg); } 100% { transform: rotate(0); } }
@keyframes armA { 0% { transform: rotate(0); } 25% { transform: rotate(22deg); } 75% { transform: rotate(-22deg); } 100% { transform: rotate(0); } }
.armR { transform: rotate(-67deg); }
[data-w="hot"] .armR { transform: rotate(-110deg); }
[data-w="snow"] .armR { transform: rotate(-25deg); }
[data-w="wind"] .armR { transform: rotate(165deg); }
[data-w="fog"] .armR { transform: rotate(-75deg); }
.lean { transition: transform .4s; }
[data-w="snow"] .lean { transform: rotate(3deg); }
[data-w="storm"] .lean { transform: rotate(7deg); }
[data-w="wind"] .lean { transform: rotate(10deg); }
.run [data-w="snow"] .shiver, [data-w="snow"].run .shiver { animation: shiver .14s linear infinite; }
@keyframes shiver { 0%, 100% { transform: translateX(-1px); } 50% { transform: translateX(1px); } }
.eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

.acc, .m { display: none; }
[data-w="hot"] .a-hot, [data-w="rain"] .a-umb, [data-w="storm"] .a-umb, [data-w="snow"] .a-snow,
[data-w="wind"] .a-wind, [data-w="fog"] .a-fog,
[data-w="snow"] .a-scarf, [data-w="wind"] .a-scarf, [data-w="fog"] .a-scarf,
[data-w="snow"] .a-breath, [data-w="fog"] .a-breath { display: inline; }
[data-w="rain"] .m-smile, [data-w="hot"] .m-smile, [data-w="wind"] .m-smile { display: inline; }
[data-w="storm"] .m-o { display: inline; }
[data-w="snow"] .m-chat { display: inline; }
[data-w="fog"] .m-flat { display: inline; }

.umb { animation: wob 3s ease-in-out infinite alternate; }
[data-w="storm"] .umb { animation: wob-hard .4s ease-in-out infinite alternate; }
@keyframes wob { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
@keyframes wob-hard { from { transform: rotate(-9deg); } to { transform: rotate(7deg); } }
.canopy { transform-box: fill-box; transform-origin: 50% 100%; }
.run .canopy { animation: umbopen .7s cubic-bezier(.3, 1.6, .5, 1) .9s both; }
@keyframes umbopen { from { transform: scale(.12, .5); } to { transform: scale(1); } }
.run .glasses { animation: dropin .4s ease-out 1.3s both; }
@keyframes dropin { from { transform: translateY(-26px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.fan { animation: fan .45s ease-in-out infinite alternate; }
@keyframes fan { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
.sweat { animation: sweat 1.7s ease-in infinite; opacity: 0; }
@keyframes sweat { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(26px); opacity: 0; } }
.tail { animation: flap .5s ease-in-out infinite alternate; }
[data-w="wind"] .tail { animation-duration: .22s; }
@keyframes flap { from { transform: rotate(calc(var(--amp) * -1)); } to { transform: rotate(var(--amp)); } }
.cap { animation: capflut .3s ease-in-out infinite alternate; transform-origin: -6px -4px; }
@keyframes capflut { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
.lant { animation: lsway 2.4s ease-in-out infinite alternate; }
@keyframes lsway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.puff { transform-box: fill-box; transform-origin: center; animation: puff 2.4s ease-out infinite; opacity: 0; }
@keyframes puff { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 20% { opacity: .85; } 100% { transform: translate(22px, -10px) scale(1.5); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .stage * { animation: none !important; transition: none !important; }
  .p-rain, .p-snow, .p-leaf, .p-streak, .p-ripple, .l-flash, .l-bolt { display: none !important; }
  .canopy { transform: none; }
}


:root { color-scheme: dark; }
html, body { padding:0; margin:0; width:100%; height:100%; background: #102127; overflow:hidden; }
.stage {
  width:100%; height:100%; border:0; border-radius:0;
  --sky1: #283E48; --sky2:#77929A; --ground:#496A4E;
  --path:#71847B; --hill:#668374; --cloud:#BAC8C9;
  --mountain:#274A4F; --mountain2:#416666; --tree:#3E7055;
  --coat:#C3DF7C; --pants:#283A43; --pants-s:#33494C;
  --boot:#233039; --umb:#8DB8A9; --scarf:#F1E6C7;
  --wall:#C2CCB5; --roof:#36535A;
  position:relative;
}
.stage svg { width:100%; height:100%; object-fit:cover; display:block; }
.stage[data-w="clear"] { --sky1:#236077;--sky2:#C2DED1;--cloud:#DDE8E1;--ground:#5B8055;--path:#879A83;--hill:#6D9884;--tree:#437A53;--coat:#D8E99C;--mountain:#4F8A83;--mountain2:#80A89A; }
.stage[data-w="hot"] { --sky1:#26778B;--sky2:#DECF9E;--cloud:#DDE9DF;--ground:#838953;--path:#B7A77B;--hill:#A3A776;--tree:#587F48;--coat:#F6C579;--mountain:#7D9980;--mountain2:#ACB39B; }
.stage[data-w="cloud"] { --sky1:#365867;--sky2:#A2B7A9;--ground:#57715D;--path:#8A9286;--hill:#70877C;--cloud:#CBD7D3;--mountain:#4A7274;--mountain2:#71918A; }
.stage[data-w="rain"] { --sky1:#213943;--sky2:#677D84;--ground:#44634F;--path:#72827D;--hill:#4E6C65;--cloud:#889EA3;--mountain:#2C525A;--mountain2:#4A6A69;--coat:#C6D787; }
.stage[data-w="storm"] { --sky1:#18272D;--sky2:#4B6268;--ground:#344F43;--path:#657C76;--hill:#3F6058;--cloud:#63757B;--mountain:#274146;--mountain2:#385455;--coat:#BBD779;--umb:#8FC5AE; }
.stage[data-w="snow"] { --sky1:#657C83;--sky2:#CBDAD4;--ground:#DDE9E0;--path:#B8C9C5;--hill:#C5D7D5;--tree:#D0E5D9;--mountain:#A1BABD;--mountain2:#C5D8D5;--coat:#456878;--scarf:#E8EABF; }
.stage[data-w="wind"] { --sky1:#315F70;--sky2:#BDD4BC;--ground:#62815D;--path:#95A894;--hill:#729D83;--cloud:#DCEAE0;--mountain:#4A8583;--mountain2:#85A996;--coat:#B7D68E;--cd:13s; }
.stage[data-w="fog"] { --sky1:#5D7776;--sky2:#BBCBC0;--ground:#728A78;--path:#A0B5A9;--hill:#7F9B92;--cloud:#B9CBC6;--mountain:#769A93;--mountain2:#9BAFA5;--coat:#9EC6A3; }
.stage[data-w="clear"] .l-sun, .stage[data-w="hot"] .l-sun { display:inline; }
.stage[data-w="clear"] .l-clouds { opacity:.35; }
.stage[data-w="clear"] .m-smile, .stage[data-w="cloud"] .m-smile { display:inline; }
.stage[data-night="true"] { --sky1:#0D1B29;--sky2:#304953;--ground:#2F5042;--path:#536A65;--hill:#294D4D;--cloud:#60777D;--mountain:#1F3C47;--mountain2:#34565A;--tree:#244A3B;--wall:#899E92;--roof:#2B4650; }
.stage[data-night="true"] .l-sun { display:none; }
.stage[data-night="true"] .moon { display:inline; }
.stage[data-night="true"] .stars { display:inline; }
.stage[data-night="true"][data-w="storm"] .moon,
.stage[data-night="true"][data-w="rain"] .moon,
.stage[data-night="true"][data-w="fog"] .moon { display:none; }
.stage[data-night="true"][data-w="storm"] .stars,
.stage[data-night="true"][data-w="rain"] .stars,
.stage[data-night="true"][data-w="fog"] .stars { display:none; }
.moon, .stars { display:none; }
.stars circle { fill:#EAF5E6; animation:twinkle 4s ease-in-out infinite alternate; }
@keyframes twinkle { 0% { opacity:.3; } 100% { opacity:.85; } }
.stage[data-w="storm"] .p-rain { opacity:.94; }
.stage[data-w="rain"] .p-rain { opacity:.68; }
.stage[data-w="storm"] .tree { animation-duration:.6s; }
.stage[data-w="fog"] .far { opacity:.38; }
.stage[data-w="snow"] .far { opacity:.85; }
/* Gradients give the SVG atmosphere and depth rather than flat cartoon fills. */
.l-clouds .cl { fill:url(#cloudsurface); }
.tree-fill { fill:url(#foliagesurface); }
/* Atmospheric vignette and layered lighting; no tappable elements */
.stage::after { content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(9,22,24,.06),transparent 28%,transparent 73%,rgba(8,22,24,.1)),linear-gradient(0deg,rgba(12,31,27,.16),transparent 27%); }
@media (prefers-reduced-motion: reduce) { .stage *, .stage *::before, .stage *::after { animation:none!important; transition:none!important; } }
</style></head><body><div class="stage run" id="stage" data-w="cloud" data-night="false">
    <svg viewBox="0 0 800 500" role="img" aria-label="Animated character Pip leaving his house and reacting to the selected weather">
      <defs>
        <linearGradient id="atmosphere" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05151A" stop-opacity=".32"/><stop offset=".55" stop-color="#EEF7B2" stop-opacity="0"/><stop offset="1" stop-color="#DEEC9C" stop-opacity=".28"/></linearGradient>
         <linearGradient id="cloudsurface" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F3EE" stop-opacity=".95"/><stop offset=".8" stop-color="var(--cloud)"/><stop offset="1" stop-color="#617980" stop-opacity=".85"/></linearGradient>
         <linearGradient id="foliagesurface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7EAF82"/><stop offset=".7" stop-color="var(--tree)"/><stop offset="1" stop-color="#274D3B"/></linearGradient>
         <linearGradient id="roofsurface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--roof)"/><stop offset="1" stop-color="#1B353F"/></linearGradient>
         <linearGradient id="wallsurface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFF2D9"/><stop offset=".48" stop-color="var(--wall)"/><stop offset="1" stop-color="#899C8B"/></linearGradient>
         <linearGradient id="moonglow"><stop offset="0" stop-color="#D4EFFF" stop-opacity=".30"/><stop offset="1" stop-color="#D4EFFF" stop-opacity="0"/></radialGradient>
         <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop class="sky-s1" offset="0"/><stop class="sky-s2" offset="1"/></linearGradient>
        <radialGradient id="sunglow"><stop offset="0" stop-color="#fff2a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff2a8" stop-opacity="0"/></radialGradient>
        <radialGradient id="lglow"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient>
        <linearGradient id="fogg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <g id="cloud">

      </defs>

      <rect width="800" height="500" fill="url(#sky)"/>
       <rect width="800" height="500" fill="url(#atmosphere)" opacity=".63"/>
       <g class="stars" id="stars"></g>
       <g class="moon" transform="translate(678,92)"><circle r="63" fill="url(#moonglow)"/><circle r="28" fill="#F3F8E9"/><circle cx="-10" cy="-9" r="6" fill="#D6E4DB" opacity=".6"/></g>
       <path d="M0 358 Q84 287 176 349 T367 331 T578 343 T800 320 V442 H0Z" fill="var(--mountain)" opacity=".68"/>
       <path d="M0 400 Q178 315 330 395 T641 372 T800 383 V440 H0Z" fill="var(--mountain2)" opacity=".6"/>


      <g class="l-sun" transform="translate(690,92)">
        <circle r="96" fill="url(#sunglow)"/>
        <g class="rays" stroke="#ffd23f" stroke-width="5" stroke-linecap="round">
          <line y1="-54" y2="-72"/><line y1="-54" y2="-72" transform="rotate(45)"/><line y1="-54" y2="-72" transform="rotate(90)"/><line y1="-54" y2="-72" transform="rotate(135)"/>
          <line y1="-54" y2="-72" transform="rotate(180)"/><line y1="-54" y2="-72" transform="rotate(225)"/><line y1="-54" y2="-72" transform="rotate(270)"/><line y1="-54" y2="-72" transform="rotate(315)"/>
        </g>

      <g class="l-clouds">
        <g transform="translate(0,70)"><g class="drift" style="--k:1;--f:-.15"><use class="cl" href="#cloud" transform="scale(1.3)"/></g></g>
        <g transform="translate(0,135)"><g class="drift" style="--k:1.4;--f:-.6"><use class="cl" href="#cloud" transform="scale(1)"/></g></g>
        <g transform="translate(0,45)"><g class="drift" style="--k:.8;--f:-.85"><use class="cl" href="#cloud" transform="scale(.8)"/></g></g>
      </g>

      <path class="far" d="M0 420 Q120 335 260 398 T520 372 T800 392 V430 H0Z" fill="var(--hill)"/>

      <!-- tree -->
      <g class="far"><g class="tree">
        <rect x="684" y="330" width="14" height="92" rx="5" fill="#6b4a35"/>
        <g class="tree-fill"><circle cx="691" cy="300" r="46"/><circle cx="658" cy="326" r="32"/><circle cx="724" cy="326" r="32"/>
        <ellipse cx="681" cy="294" rx="29" ry="20" fill="#B1E1A6" fill-opacity=".08"/></g>
      </g></g>

      <!-- house -->
      <g class="far">
        <rect x="205" y="236" width="24" height="46" fill="#7d5f52"/>
        <rect x="60" y="300" width="190" height="122" fill="url(#wallsurface)"/>
         <rect x="60" y="300" width="8" height="122" fill="#203B3B" opacity=".14"/>
        <polygon points="40,302 155,212 270,302" fill="url(#roofsurface)"/>
         <path d="M40 302 L155 212 L270 302" fill="none" stroke="#D5E8D1" stroke-opacity=".17" stroke-width="3"/>
        <polygon class="snowcap" points="40,302 155,212 270,302 262,302 155,222 48,302" fill="#fff"/>
